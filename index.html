<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vectorizer</title>
<style>
  :root {
    --bg: #f5f5f4;
    --card: #ffffff;
    --text: #1c1917;
    --muted: #78716c;
    --border: #d6d3d1;
    --accent: #2563eb;
    --accent-hover: #1d4ed8;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1c1917;
      --card: #292524;
      --text: #f5f5f4;
      --muted: #a8a29e;
      --border: #44403c;
      --accent: #3b82f6;
      --accent-hover: #60a5fa;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 24px 16px;
    gap: 16px;
  }
  h1 { margin: 0; font-size: 1.4rem; font-weight: 600; }
  .card {
    width: 100%;
    max-width: 560px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 24px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }
  .drop {
    border: 2px dashed var(--border);
    border-radius: 12px;
    min-height: 220px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 8px;
    cursor: pointer;
    text-align: center;
    padding: 16px;
    transition: border-color .15s, background .15s;
  }
  .drop:hover, .drop.over { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 6%, transparent); }
  .drop strong { font-size: 1.1rem; }
  .drop span { color: var(--muted); font-size: .9rem; }
  .drop img { max-width: 100%; max-height: 260px; border-radius: 8px; }
  button {
    font: inherit;
    font-weight: 600;
    border: none;
    border-radius: 10px;
    padding: 12px 16px;
    background: var(--accent);
    color: #fff;
    cursor: pointer;
  }
  button:hover:not(:disabled) { background: var(--accent-hover); }
  button:disabled { opacity: .45; cursor: not-allowed; }
  button.secondary { background: transparent; color: var(--text); border: 1px solid var(--border); }
  button.secondary:hover:not(:disabled) { background: var(--bg); }
  .progress { height: 8px; border-radius: 99px; background: var(--border); overflow: hidden; display: none; }
  .progress > div { height: 100%; width: 0; background: var(--accent); border-radius: 99px; transition: width .2s; }
  .viewer {
    position: relative;
    height: 380px;
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
    cursor: grab;
    touch-action: none;
    background:
      repeating-conic-gradient(var(--border) 0 25%, transparent 0 50%) 0 0 / 20px 20px;
  }
  .viewer.dragging { cursor: grabbing; }
  .viewer .stage { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
  .viewer .stage svg { display: block; }
  .toolbar { display: flex; gap: 8px; flex-wrap: wrap; }
  .toolbar button { flex: 1; }
  .hidden { display: none !important; }
  .hint { color: var(--muted); font-size: .8rem; text-align: center; margin: 0; }
</style>
</head>
<body>
  <h1>Vectorizer</h1>

  <div class="card">
    <!-- Paso 1: subir -->
    <section id="upload">
      <label class="drop" id="drop">
        <input type="file" id="file" accept="image/*" hidden>
        <div id="dropContent">
          <strong>Subir foto</strong><br>
          <span>o arrastrala acá</span>
        </div>
      </label>
    </section>

    <div class="progress" id="progress"><div id="bar"></div></div>
    <button id="vectorize" disabled>Vectorizar</button>

    <!-- Paso 2: resultado -->
    <section id="result" class="hidden">
      <div class="viewer" id="viewer"><div class="stage" id="stage"></div></div>
      <p class="hint">Rueda o pellizco para zoom · arrastrá para mover · doble click para ajustar</p>
      <div class="toolbar">
        <button class="secondary" id="zoomOut">−</button>
        <button class="secondary" id="fit">Ajustar</button>
        <button class="secondary" id="zoomIn">+</button>
      </div>
      <div class="toolbar" style="margin-top:8px">
        <button class="secondary" id="again">Otra imagen</button>
        <button id="download">Descargar SVG</button>
      </div>
    </section>
  </div>

<script>
const TRACER_URL = 'https://cdn.jsdelivr.net/npm/imagetracerjs@1.2.6/imagetracer_v1.2.6.js';
const MAX_SIDE = 1200; // reducimos imágenes grandes para que no tarde una eternidad

const $ = id => document.getElementById(id);
const drop = $('drop'), fileInput = $('file'), dropContent = $('dropContent');
const vectorizeBtn = $('vectorize'), progress = $('progress'), bar = $('bar');
const uploadSec = $('upload'), resultSec = $('result');
const viewer = $('viewer'), stage = $('stage');

let currentImage = null;
let svgString = null;
let fileName = 'imagen';

// ---------- Subida / drag & drop ----------
fileInput.addEventListener('change', () => fileInput.files[0] && loadFile(fileInput.files[0]));
['dragenter', 'dragover'].forEach(e => drop.addEventListener(e, ev => { ev.preventDefault(); drop.classList.add('over'); }));
['dragleave', 'drop'].forEach(e => drop.addEventListener(e, ev => { ev.preventDefault(); drop.classList.remove('over'); }));
drop.addEventListener('drop', ev => {
  const f = ev.dataTransfer.files[0];
  if (f && f.type.startsWith('image/')) loadFile(f);
});

function loadFile(file) {
  fileName = file.name.replace(/\.[^.]+$/, '') || 'imagen';
  const url = URL.createObjectURL(file);
  const img = new Image();
  img.onload = () => {
    currentImage = img;
    dropContent.innerHTML = '';
    const preview = img.cloneNode();
    dropContent.appendChild(preview);
    vectorizeBtn.disabled = false;
  };
  img.src = url;
}

// ---------- Vectorizar (en un Worker para no congelar la página) ----------
const workerSrc = `
  importScripts('${TRACER_URL}');
  onmessage = e => {
    const { imgd, options } = e.data;
    const svg = ImageTracer.imagedataToSVG(imgd, options);
    postMessage(svg);
  };
`;
const worker = new Worker(URL.createObjectURL(new Blob([workerSrc], { type: 'text/javascript' })));

vectorizeBtn.addEventListener('click', () => {
  if (!currentImage) return;
  vectorizeBtn.disabled = true;
  progress.style.display = 'block';
  setProgress(0);

  // Barra de carga: avanza sola hasta ~90% y completa cuando termina
  let p = 0;
  const timer = setInterval(() => { p += (90 - p) * 0.05; setProgress(p); }, 100);

  const imgd = getImageData(currentImage);
  worker.onmessage = e => {
    clearInterval(timer);
    setProgress(100);
    svgString = e.data;
    setTimeout(() => showResult(), 300);
  };
  worker.onerror = err => {
    clearInterval(timer);
    progress.style.display = 'none';
    vectorizeBtn.disabled = false;
    alert('Error al vectorizar: ' + err.message);
  };
  worker.postMessage({
    imgd: { width: imgd.width, height: imgd.height, data: imgd.data },
    options: { numberofcolors: 16, pathomit: 8, ltres: 1, qtres: 1, roundcoords: 1, viewbox: true },
  });
});

function getImageData(img) {
  const scale = Math.min(1, MAX_SIDE / Math.max(img.naturalWidth, img.naturalHeight));
  const w = Math.round(img.naturalWidth * scale), h = Math.round(img.naturalHeight * scale);
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  const ctx = c.getContext('2d');
  ctx.drawImage(img, 0, 0, w, h);
  return ctx.getImageData(0, 0, w, h);
}

function setProgress(v) { bar.style.width = v + '%'; }

// ---------- Visor con zoom / pan ----------
let view = { x: 0, y: 0, s: 1 }, svgW = 1, svgH = 1;

function showResult() {
  progress.style.display = 'none';
  uploadSec.classList.add('hidden');
  vectorizeBtn.classList.add('hidden');
  resultSec.classList.remove('hidden');

  stage.innerHTML = svgString;
  const svg = stage.querySelector('svg');
  const vb = svg.viewBox.baseVal;
  svgW = vb && vb.width ? vb.width : +svg.getAttribute('width');
  svgH = vb && vb.height ? vb.height : +svg.getAttribute('height');
  svg.setAttribute('width', svgW);
  svg.setAttribute('height', svgH);
  fit();
}

function apply() { stage.style.transform = `translate(${view.x}px, ${view.y}px) scale(${view.s})`; }

function fit() {
  const r = viewer.getBoundingClientRect();
  view.s = Math.min(r.width / svgW, r.height / svgH) * 0.95;
  view.x = (r.width - svgW * view.s) / 2;
  view.y = (r.height - svgH * view.s) / 2;
  apply();
}

function zoomAt(factor, cx, cy) {
  const s = Math.min(50, Math.max(0.05, view.s * factor));
  factor = s / view.s;
  view.x = cx - (cx - view.x) * factor;
  view.y = cy - (cy - view.y) * factor;
  view.s = s;
  apply();
}

function zoomCenter(factor) {
  const r = viewer.getBoundingClientRect();
  zoomAt(factor, r.width / 2, r.height / 2);
}

viewer.addEventListener('wheel', e => {
  e.preventDefault();
  const r = viewer.getBoundingClientRect();
  zoomAt(Math.exp(-e.deltaY * 0.0015), e.clientX - r.left, e.clientY - r.top);
}, { passive: false });

// Arrastrar (mouse y touch) + pellizco
const pointers = new Map();
let lastDist = 0;
viewer.addEventListener('pointerdown', e => {
  viewer.setPointerCapture(e.pointerId);
  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  viewer.classList.add('dragging');
});
viewer.addEventListener('pointermove', e => {
  if (!pointers.has(e.pointerId)) return;
  const prev = pointers.get(e.pointerId);
  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (pointers.size === 1) {
    view.x += e.clientX - prev.x;
    view.y += e.clientY - prev.y;
    apply();
  } else if (pointers.size === 2) {
    const [a, b] = [...pointers.values()];
    const dist = Math.hypot(a.x - b.x, a.y - b.y);
    if (lastDist) {
      const r = viewer.getBoundingClientRect();
      zoomAt(dist / lastDist, (a.x + b.x) / 2 - r.left, (a.y + b.y) / 2 - r.top);
    }
    lastDist = dist;
  }
});
['pointerup', 'pointercancel'].forEach(t => viewer.addEventListener(t, e => {
  pointers.delete(e.pointerId);
  lastDist = 0;
  if (!pointers.size) viewer.classList.remove('dragging');
}));
viewer.addEventListener('dblclick', fit);
$('zoomIn').onclick = () => zoomCenter(1.25);
$('zoomOut').onclick = () => zoomCenter(0.8);
$('fit').onclick = fit;

// ---------- Descargar / reiniciar ----------
$('download').onclick = () => {
  const blob = new Blob([svgString], { type: 'image/svg+xml' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = fileName + '.svg';
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
};

$('again').onclick = () => {
  resultSec.classList.add('hidden');
  uploadSec.classList.remove('hidden');
  vectorizeBtn.classList.remove('hidden');
  vectorizeBtn.disabled = true;
  dropContent.innerHTML = '<strong>Subir foto</strong><br><span>o arrastrala acá</span>';
  fileInput.value = '';
  currentImage = null;
  svgString = null;
};
</script>
</body>
</html>
