<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Convertí tus imágenes a SVG directamente en el navegador.">
  <title>Vectorizer</title>
  <link rel="stylesheet" href="css/styles.css">
  <script type="module" src="js/main.js"></script>
</head>
<body>
  <main class="app">
    <h1 class="app__title">Vectorizer</h1>

    <div class="card">
      <!-- Paso 1: subir la imagen -->
      <section id="upload-step" class="step" aria-label="Subir imagen">
        <label id="dropzone" class="dropzone">
          <input type="file" accept="image/*" class="visually-hidden">
          <span class="dropzone__text">
            <strong>Subir foto</strong>
            <span>o arrastrala acá</span>
          </span>
          <img class="dropzone__preview" alt="Vista previa de la imagen">
        </label>

        <div id="progress" class="progress" role="progressbar" aria-label="Vectorizando"
             aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" hidden>
          <div class="progress__fill"></div>
        </div>

        <button id="vectorize-button" class="button" type="button" disabled>Vectorizar</button>
      </section>

      <!-- Paso 2: ver y descargar el resultado -->
      <section id="result-step" class="step" aria-label="Resultado" hidden>
        <div id="viewer" class="viewer"></div>
        <p class="hint">Rueda o pellizco para zoom · arrastrá para mover · doble click para ajustar</p>

        <div class="toolbar">
          <button id="zoom-out" class="button button--secondary" type="button" aria-label="Alejar">−</button>
          <button id="zoom-fit" class="button button--secondary" type="button">Ajustar</button>
          <button id="zoom-in" class="button button--secondary" type="button" aria-label="Acercar">+</button>
        </div>
        <div class="toolbar">
          <button id="restart-button" class="button button--secondary" type="button">Otra imagen</button>
          <button id="download-button" class="button" type="button">Descargar SVG</button>
        </div>
      </section>

      <p id="error" class="error" role="alert" hidden></p>
    </div>
  </main>
</body>
</html>
